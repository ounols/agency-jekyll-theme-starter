<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="컴포넌트 Controller 구조와 AI 에이전트용 규약">
  <title>컴포넌트 Controller 구조와 AI 에이전트용 규약</title>
  <style>
    svg { fill: #E6EDF3; }
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
    .muted, .muted text { fill: #8B949E; }
    .h1 { font-size: 40px; font-weight: 700; }
    .sub { font-size: 22px; }
    .rg { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
    .tag { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; fill: #fff; }
    .nt { font-size: 26px; font-weight: 700; }
    .ns { font-size: 19px; }
    .pl { font-size: 17px; font-weight: 700; }
    .ps { font-size: 15px; }
    .code { font-family: "JetBrains Mono", Consolas, Menlo, monospace; font-size: 18px; }
    .panel { fill: #21262D; stroke-width: 2; }
    .region { fill: #1C2128; stroke: #30363D; stroke-width: 2; stroke-dasharray: 10 8; }
    .e { stroke-width: 3; fill: none; }
  </style>
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4A90D9"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#50B87A"/></marker>
    <marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#F5A623"/></marker>
    <marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B57EDC"/></marker>
    <marker id="mm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8B949E"/></marker>
  </defs>

  <rect width="1600" height="1000" fill="#161b22"/>

  <text x="80" y="92" class="h1">컴포넌트 Controller 구조와 AI 에이전트용 규약</text>
  <text x="80" y="134" class="sub muted">움직임 · 활동은 Controller 컴포넌트로 분리하고, 사용 규약은 스킬 프롬프트와 주석으로 AI에게 전달</text>

  <rect x="80" y="180" width="720" height="620" rx="18" class="region"/>
  <text x="104" y="214" class="rg muted">전장 오브젝트 · ACTOR</text>
  <rect x="860" y="180" width="660" height="620" rx="18" class="region"/>
  <text x="884" y="214" class="rg muted">AI 에이전트가 읽는 규약</text>

  <path d="M260 466 V386" class="e" stroke="#B57EDC" marker-end="url(#mp)"/>
  <path d="M620 466 V386" class="e" stroke="#B57EDC" marker-end="url(#mp)"/>
  <path d="M260 616 V664" class="e" stroke="#8B949E" marker-end="url(#mm)"/>
  <path d="M620 616 V664" class="e" stroke="#8B949E" marker-end="url(#mm)"/>
  <text x="440" y="432" text-anchor="middle" class="pl" fill="#D2A8FF">직렬화 데이터 획득</text>
  <text x="440" y="646" text-anchor="middle" class="pl muted">필요한 오브젝트 조회</text>
  <rect x="120" y="240" width="640" height="140" rx="14" class="panel" stroke="#B57EDC" stroke-opacity="0.6"/>
  <path d="M120 254 a14 14 0 0 1 14 -14 h612 a14 14 0 0 1 14 14 v26 h-640 z" fill="#B57EDC"/>
  <text x="142" y="267" class="tag">DATA</text>
  <text x="142" y="320" class="nt">Serialization Component</text>
  <text x="142" y="360" class="ns muted">에디터 · 파일과 공유하는 전장 데이터</text>
  <rect x="120" y="470" width="280" height="146" rx="14" class="panel" stroke="#4A90D9" stroke-opacity="0.6"/>
  <path d="M120 484 a14 14 0 0 1 14 -14 h252 a14 14 0 0 1 14 14 v26 h-280 z" fill="#4A90D9"/>
  <text x="142" y="497" class="tag">CONTROLLER</text>
  <text x="142" y="550" class="nt">Movement</text>
  <text x="142" y="590" class="ns muted">기동 · 경로 추종</text>
  <rect x="480" y="470" width="280" height="146" rx="14" class="panel" stroke="#F5A623" stroke-opacity="0.6"/>
  <path d="M480 484 a14 14 0 0 1 14 -14 h252 a14 14 0 0 1 14 14 v26 h-280 z" fill="#F5A623"/>
  <text x="502" y="497" class="tag">CONTROLLER</text>
  <text x="502" y="550" class="nt">Activity</text>
  <text x="502" y="590" class="ns muted">임무 · 교전 활동</text>
  <rect x="120" y="670" width="640" height="96" rx="14" fill="#30363D" fill-opacity="0.5" stroke="#8B949E" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="144" y="710" class="nt" style="font-size:22px">다른 전장 오브젝트</text>
  <text x="144" y="742" class="ns muted">편대 · 임무 경로 · 목표 등 링크된 참조</text>
  <rect x="900" y="240" width="580" height="200" rx="14" class="panel" stroke="#50B87A" stroke-opacity="0.6"/>
  <path d="M900 254 a14 14 0 0 1 14 -14 h552 a14 14 0 0 1 14 14 v26 h-580 z" fill="#50B87A"/>
  <text x="922" y="267" class="tag">SKILL PROMPT</text>
  <text x="922" y="320" class="nt">Controller 작성 가이드</text>
  <text x="922" y="360" class="ns">· 직렬화 컴포넌트를 받아오는 방식</text>
  <text x="922" y="390" class="ns">· 다양한 전장 오브젝트를 불러오는 방식</text>
  <text x="922" y="420" class="ns muted">· 지켜야 할 제약과 예시 코드</text>
  <rect x="900" y="460" width="580" height="160" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <text x="922" y="498" class="code" fill="#8B949E">// Controller는 데이터를 직접 소유하지 않고</text>
  <text x="922" y="528" class="code" fill="#8B949E">// 소유 Actor의 직렬화 컴포넌트에서 받아옴</text>
  <text x="922" y="558" class="code" fill="#8B949E">// 다른 오브젝트는 Link 단계 이후에만 조회</text>
  <text x="922" y="598" class="ps" fill="#7EE2A8">주석 — 코드 옆에서 의도와 사용법을 설명</text>

  <path d="M1190 624 V660" class="e" stroke="#50B87A" marker-end="url(#mg)"/>
  <rect x="900" y="666" width="580" height="100" rx="14" fill="#50B87A" fill-opacity="0.14" stroke="#50B87A" stroke-opacity="0.7" stroke-width="2"/>
  <text x="922" y="706" class="nt" style="font-size:22px">AI 에이전트</text>
  <text x="922" y="740" class="ns muted">코드베이스를 매번 탐색하지 않고 규약대로 바로 구현</text>

  <path d="M896 716 C836 716 836 543 766 543" class="e" stroke="#50B87A" stroke-dasharray="8 6" marker-end="url(#mg)"/>

  <rect x="80" y="840" width="1440" height="100" rx="12" fill="#21262D" stroke="#30363D" stroke-width="2"/>
  <text x="110" y="882" class="sub">설계 프레임워크와 분리된 <tspan fill="#4A90D9" font-weight="700">움직임 · 활동</tspan>을 Controller 컴포넌트로 모듈화</text>
  <text x="110" y="916" class="sub muted">AI가 한 번에 다루기 좋은 작은 단위 + 미리 정리된 규약 = 탐색에 쓰이는 토큰 최소화</text>
</svg>
