<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="워게임 에디터 및 시뮬레이터 아키텍처">
  <title>워게임 에디터 및 시뮬레이터 아키텍처</title>
  <style>
    svg { fill: #E6EDF3; }
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
    .muted, .muted text { fill: #8B949E; }
    .h1 { font-size: 40px; font-weight: 700; }
    .sub { font-size: 22px; }
    .rg { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
    .tag { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; fill: #fff; }
    .nt { font-size: 28px; font-weight: 700; }
    .ns { font-size: 19px; }
    .nd { font-size: 18px; font-weight: 600; }
    .pl { font-size: 17px; font-weight: 700; }
    .ps { font-size: 15px; }
    .panel { fill: #21262D; stroke-width: 2; }
    .region { fill: #1C2128; stroke: #30363D; stroke-width: 2; stroke-dasharray: 10 8; }
    .e { stroke-width: 3; fill: none; }
  </style>
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4A90D9"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#50B87A"/></marker>
    <marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#F5A623"/></marker>
    <marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B57EDC"/></marker>
  </defs>

  <rect width="1600" height="1000" fill="#161b22"/>

  <text x="80" y="92" class="h1">워게임 에디터 · 시뮬레이터 아키텍처</text>
  <text x="80" y="134" class="sub muted">MVC를 변형한 MVC + Observer 구조 — Bridge가 Unreal World와 UMG Widget 사이를 중재</text>

  <!-- regions -->
  <rect x="80" y="180" width="320" height="660" rx="18" class="region"/>
  <text x="104" y="214" class="rg muted">UNREAL WORLD</text>
  <rect x="520" y="180" width="340" height="660" rx="18" class="region"/>
  <text x="544" y="214" class="rg muted">COORDINATOR</text>
  <rect x="920" y="180" width="620" height="660" rx="18" class="region"/>
  <text x="944" y="214" class="rg muted">MVC + OBSERVER</text>

  <!-- edges -->
  <path d="M370 500 H542" class="e" stroke="#4A90D9" marker-end="url(#mb)"/>
  <path d="M830 450 C900 450 900 330 972 330" class="e" stroke="#50B87A" marker-end="url(#mg)"/>
  <path d="M830 550 C900 550 900 650 972 650" class="e" stroke="#50B87A" marker-end="url(#mg)"/>
  <path d="M1060 400 V572" class="e" stroke="#F5A623" marker-end="url(#mo)"/>
  <path d="M1400 580 V408" class="e" stroke="#B57EDC" marker-end="url(#mp)"/>
  <path d="M1230 720 V752" class="e" stroke="#B57EDC" stroke-dasharray="6 6"/>
  <g>
    <rect x="110" y="420" width="260" height="160" rx="14" class="panel" stroke="#4A90D9" stroke-opacity="0.6"/>
    <path d="M110 434 a14 14 0 0 1 14 -14 h232 a14 14 0 0 1 14 14 v26 h-260 z" fill="#4A90D9"/>
    <text x="134" y="447" class="tag">INPUT</text>
    <text x="134" y="502" class="nt">Camera</text>
    <text x="134" y="534" class="ns muted">User Input</text>
    <text x="134" y="566" class="nd" fill="#4A90D9">Click · Drag · Zoom</text>
  </g>
  <g>
    <rect x="550" y="400" width="280" height="200" rx="14" class="panel" stroke="#50B87A" stroke-opacity="0.6"/>
    <path d="M550 414 a14 14 0 0 1 14 -14 h252 a14 14 0 0 1 14 14 v26 h-280 z" fill="#50B87A"/>
    <text x="574" y="427" class="tag">BRIDGE</text>
    <text x="574" y="482" class="nt">Bridge</text>
    <text x="574" y="514" class="ns muted">World ↔ Widget 중재</text>
    <text x="574" y="546" class="nd" fill="#50B87A">Event Routing · Lifecycle</text>
  </g>
  <g>
    <rect x="980" y="240" width="500" height="160" rx="14" class="panel" stroke="#F5A623" stroke-opacity="0.6"/>
    <path d="M980 254 a14 14 0 0 1 14 -14 h472 a14 14 0 0 1 14 14 v26 h-500 z" fill="#F5A623"/>
    <text x="1004" y="267" class="tag">VIEW · UMG</text>
    <text x="1004" y="322" class="nt">EditorWidget</text>
    <text x="1004" y="354" class="ns muted">UI Rendering · Property Edit</text>
    <text x="1004" y="386" class="nd" fill="#F5A623">UMG Widget</text>
  </g>
  <g>
    <rect x="980" y="580" width="500" height="140" rx="14" class="panel" stroke="#B57EDC" stroke-opacity="0.6"/>
    <path d="M980 594 a14 14 0 0 1 14 -14 h472 a14 14 0 0 1 14 14 v26 h-500 z" fill="#B57EDC"/>
    <text x="1004" y="607" class="tag">MODEL</text>
    <text x="1004" y="662" class="nt">ObjectContainer</text>
    <text x="1004" y="694" class="ns muted">Data Tree · Serialization</text>
      </g>
  <g>
    <rect x="1080" y="760" width="300" height="56" rx="12" fill="#B57EDC" fill-opacity="0.12" stroke="#B57EDC" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="1230" y="796" text-anchor="middle" class="nd" fill="#D2A8FF">전장 파일 · Save / Load</text>
  </g>
  <g text-anchor="middle">
    <rect x="381" y="470" width="150" height="60" rx="12" fill="#161b22" stroke="#4A90D9" stroke-opacity="0.7" stroke-width="2"/>
    <text x="456" y="495" class="pl" fill="#4A90D9">Delegate</text>
    <text x="456" y="518" class="ps muted">Selection · Click</text>
  </g>
  <g text-anchor="middle">
    <rect x="825" y="360" width="150" height="60" rx="12" fill="#161b22" stroke="#50B87A" stroke-opacity="0.7" stroke-width="2"/>
    <text x="900" y="385" class="pl" fill="#50B87A">Direct Call</text>
    <text x="900" y="408" class="ps muted">Update UI</text>
  </g>
  <g text-anchor="middle">
    <rect x="820" y="580" width="160" height="60" rx="12" fill="#161b22" stroke="#50B87A" stroke-opacity="0.7" stroke-width="2"/>
    <text x="900" y="605" class="pl" fill="#50B87A">Spawn · Query</text>
    <text x="900" y="628" class="ps muted">World 오브젝트</text>
  </g>
  <text x="1076" y="462" class="pl" fill="#F5A623">Serialize /</text>
  <text x="1076" y="484" class="pl" fill="#F5A623">Deserialize</text>
  <text x="1076" y="508" class="ps muted">편집 → Model 반영</text>
  <text x="1384" y="484" class="pl" fill="#B57EDC" text-anchor="end">Change Notify</text>
  <text x="1384" y="508" class="ps muted" text-anchor="end">Observer · 단방향</text>

  <!-- takeaways -->
  <g class="sub">
    <rect x="80" y="876" width="460" height="72" rx="12" fill="#21262D" stroke="#30363D" stroke-width="2"/>
    <text x="104" y="920"><tspan fill="#B57EDC" font-weight="700">Model → View</tspan> 단방향 흐름</text>
    <rect x="570" y="876" width="460" height="72" rx="12" fill="#21262D" stroke="#30363D" stroke-width="2"/>
    <text x="594" y="920"><tspan fill="#50B87A" font-weight="700">Delegate · Bridge</tspan>로 UMG 의존 분리</text>
    <rect x="1060" y="876" width="460" height="72" rx="12" fill="#21262D" stroke="#30363D" stroke-width="2"/>
    <text x="1084" y="920"><tspan fill="#F5A623" font-weight="700">파일 I/O</tspan>와 같은 데이터 트리 공유</text>
  </g>
</svg>
