# AI Workflow 섹션 (떠다니는 키워드 + 팝업) 데이터
#
# 각 항목:
#   label : 키워드 칩에 표시되는 짧은 문구
#   icon  : Font Awesome solid 아이콘 이름 (fa- 제외)
#   group : 칩 색상/분류. intro(흰색) / issue(회색) / scope(파랑) / share(민트) / delegate(보라) / role(검정)
#   tag   : 팝업 상단의 분류 문구
#   desc  : 팝업 본문. 여러 문단은 빈 줄로 구분
#

- label: "협업자로서의 AI"
  icon: handshake
  group: intro
  tag: "Mindset"
  desc: |
    AI가 본격적으로 쓰이기 전부터 프로그래밍을 해 오면서, 개발 방식이 크게 바뀌는 과정을 직접 겪었습니다.

    여러 경험 끝에 AI는 도구를 넘어 또 다른 형태의 협업자에 가깝다고 생각하게 되었습니다. 그래서 사람과 협업할 때처럼 맥락을 공유하고, 역할과 경계를 정하고, 결과를 검토하는 방식으로 함께 일합니다.

- label: "Claude Code"
  icon: terminal
  group: intro
  tag: "Tool"
  desc: |
    실무에서는 주로 Claude Code를 사용합니다.

    코드 작성과 리팩토링에서 큰 도움을 받고 있으며, 플랜 모드와 스킬, 공유 지시문을 조합해 팀 프로젝트의 규칙 안에서 동작하도록 맞춰 쓰고 있습니다.

- label: "맥락 누락"
  icon: link-slash
  group: issue
  tag: "Problem"
  desc: |
    규모가 큰 프로젝트일수록 인수인계 사항이나 이전 결정의 맥락이 AI에게 전달되지 않는 경우가 많았습니다.

    이 문제를 줄이기 위해 작업 단위를 작게 나누고, 헤더 주석과 공유 프롬프트로 맥락을 코드 가까이에 남겨 두는 방식을 쓰고 있습니다.

- label: "코드 스타일 붕괴"
  icon: code
  group: issue
  tag: "Problem"
  desc: |
    여러 사람이 각자의 AI로 작업하다 보면 코드 스타일이 조금씩 흐트러졌습니다.

    그래서 코드 스타일뿐만 아니라 AI에게 주는 프롬프트의 스타일까지 팀원들과 맞추는 방식을 택했습니다.

- label: "품질 일관성"
  icon: scale-unbalanced
  group: issue
  tag: "Problem"
  desc: |
    AI가 매번 일정한 품질을 보장해 주지는 않았습니다. 같은 요청이라도 결과물의 수준이 달라지는 경우가 있었습니다.

    그래서 계획 단계에서 한 번, 결과물 단계에서 한 번 직접 검토하는 과정을 반드시 거칩니다.

- label: "작업 단위 나누기"
  icon: cubes
  group: scope
  tag: "원칙 01 · 작게 나누기"
  desc: |
    한 번에 맡기는 기능이 복잡할수록 AI의 구현 방식과 제 의도 사이의 차이가 커졌고, 진행할수록 목표에서 멀어지는 경우도 잦았습니다.

    그래서 구현할 기능의 규모를 먼저 파악하고, AI가 온전히 이해할 수 있는 크기로 나눈 뒤에 맡깁니다.

- label: "플랜 모드 검토"
  icon: list-check
  group: scope
  tag: "원칙 01 · 작게 나누기"
  desc: |
    작업을 맡기기 전에 플랜 모드로 계획을 먼저 작성하게 합니다.

    작성된 계획을 읽으면서 AI가 요구사항을 제대로 이해했는지 확인하고, 어긋난 부분이 있으면 실행 전에 바로잡습니다.

- label: "수정 범위 명시"
  icon: crop-simple
  group: scope
  tag: "원칙 01 · 작게 나누기"
  desc: |
    협업 프로젝트에서는 AI가 손대도 되는 영역을 명확히 알려주는 것이 중요했습니다.

    작업 규모에 따라 설명과 지시의 난이도가 크게 달라졌기 때문에, 작업을 작게 나눌수록 수정 가능한 범위도 더 정확하게 전달할 수 있었습니다.

- label: "팀 공통 프롬프트"
  icon: users
  group: share
  tag: "원칙 02 · 함께 맞추기"
  desc: |
    팀원들과 지시 프롬프트를 공유합니다.

    공통으로 전달받은 코드 스타일과 규칙, 설계 방식에 따른 구현 방식 등 여러 매뉴얼의 내용을 기본 프롬프트에 담아, 누가 작업하든 AI가 같은 기준으로 움직이도록 했습니다.

- label: "개인 프롬프트"
  icon: sliders
  group: share
  tag: "원칙 02 · 함께 맞추기"
  desc: |
    공통 프롬프트를 기반으로, 각자 맡은 기능에 맞는 개인 프롬프트를 추가로 작성해 사용합니다.

    기준은 팀과 맞추고 세부 지시는 기능에 맞게 다듬는 구조라서, 일관성과 유연성을 함께 챙길 수 있었습니다.

- label: "헤더 주석"
  icon: file-code
  group: share
  tag: "원칙 02 · 함께 맞추기"
  desc: |
    헤더 파일에 예외 상황이나 클래스·함수의 사용법을 주석으로 꼼꼼히 남겨 둡니다.

    이렇게 해 두면 다른 팀원의 AI 에이전트도 이를 읽고 의도에 맞게 처리해 주었습니다. 주석이 사람과 AI 모두를 위한 문서 역할을 하는 셈입니다.

- label: "직렬화 자동화"
  icon: repeat
  group: delegate
  tag: "원칙 03 · 잘하는 일 맡기기"
  desc: |
    직렬화처럼 반복적이고 레거시하게 처리해야 하는 구간은 AI가 특히 잘하는 일이었습니다.

    스킬과 지시문을 정리해 두면, 코드가 바뀔 때마다 그에 맞춰 직렬화 코드까지 알맞게 갱신해 주었습니다.

- label: "하드코딩 영역 분리"
  icon: object-ungroup
  group: delegate
  tag: "원칙 03 · 잘하는 일 맡기기"
  desc: |
    설계가 깊어 바꾸기 어려운 말단 기능은 하드코딩 영역을 따로 분리해 둡니다.

    그 경계와 구조를 프롬프트로 정해 주면, AI가 주석까지 달아 사람이 읽기에도 이해하기 쉬운 코드로 정리해 주었습니다.

- label: "프로토타이핑 · 디버깅"
  icon: bug
  group: delegate
  tag: "원칙 03 · 잘하는 일 맡기기"
  desc: |
    분리해 둔 말단 영역은 AI를 활용한 디버깅과 프로토타이핑에도 적극적으로 사용합니다.

    핵심 구조를 건드리지 않고 빠르게 시도해 볼 수 있어서, 아이디어를 검증하는 속도가 크게 빨라졌습니다.

- label: "파트장의 역할"
  icon: user-gear
  group: role
  tag: "My Role"
  desc: |
    AI와 함께 일하는 과정에서 제 역할은 파트장에 가까웠습니다.

    무엇을 어떻게 만들지 정하고, AI가 세운 계획을 검토하고, 결과물을 확인하는 일은 제가 맡았습니다.

- label: "Diff 검수"
  icon: code-compare
  group: role
  tag: "My Role"
  desc: |
    AI가 만든 결과물은 diff 툴로 직접 확인하며 검수합니다.

    변경된 내용을 한 줄씩 확인해야 의도하지 않은 수정이나 스타일 이탈을 놓치지 않을 수 있었습니다.

- label: "맥락과 경계"
  icon: lightbulb
  group: role
  tag: "Lesson"
  desc: |
    이 과정을 통해, AI 결과물의 품질은 결국 사람이 맥락과 경계를 얼마나 잘 정리하고 확인하느냐에 달려 있다는 것을 배웠습니다.
