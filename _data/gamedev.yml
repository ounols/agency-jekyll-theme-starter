- id: musicapex
  title: "고교 시절 혼자 만든 리듬게임 시뮬레이터, MusicApex"
  desc: "<br>Java로 개발한 안드로이드 SOUND VOLTEX라는 리듬게임의 시뮬레이터입니다. 이 때 처음 OpenGL을 다뤄보며 최적화부터 여러 한계까지 많은 경험을 하게 되었습니다. 이를 통해 자바 속도의 한계를 겪으며 C++ 자체 프레임워크인 자체엔진을 만들기로 마음먹은 계기가 됐습니다."
  img: "/assets/img/gamedev/musicapex.webp"
  offset: 0
  cta: "구현 영상 보기"
