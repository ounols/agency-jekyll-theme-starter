# Game Dev Works 섹션 (캔버스 스퀴즈 캐러셀) 데이터
#
# 각 항목:
#   title  : 한 문장 제목 (굵게 표시, 설명과 같은 문단에 이어서 표시됨)
#   desc   : 설명 문장 (연한 색)
#   img    : 데스크톱 캔버스용 이미지. 16:9 권장 (다른 비율은 cover 방식으로 잘림)
#            비워 두면 어두운 자리표시자 카드에 제목만 표시됨
#   img_mobile : (선택) 모바일 카드용 이미지. 없으면 img 사용. 336:350 비율 권장
#   offset : (선택) 카드가 좁게 접혔을 때 보여줄 초점을 좌우로 미는 px 값. 음수 = 왼쪽 부분을 보여줌
#   cta    : 버튼 문구
#   url    : 버튼 링크. '#'으로 시작하면 같은 페이지 내 이동. cta/url을 비우면 버튼이 표시되지 않음
#
# 데스크톱 캔버스는 한 번에 7장(큰 카드 4장 + 얇은 카드 3장)을 그리므로 7개 이상 채우는 것을 권장합니다.
# 순서는 자유롭게 바꿔도 됩니다.

- id: ai-agent-team
  title: "AI 에이전트를 팀의 게임 개발 워크플로에 끌어들였습니다"
  desc: "<br>Claude Code가 Unity 컴포넌트·어셈블리와 Unreal UCLASS·모듈 구조를 분석하는 전용 도구를 직접 만들고, 회사 프로젝트에 맞춘 멀티 에이전트 워크플로를 구축했습니다. 여러 게임 엔진에서 특정 작업을 반복 수행하는 루프 에이전트를 연구했으며, 위 사진은 자체엔진의 루프 에이전트를 만들었던 화면입니다.<br>이러한 경험을 바탕으로 팀원과 AI 에이전트가 함께 따르는 협업 가이드를 마련해 반복 작업을 줄였습니다."
  img: "/assets/img/gamedev/ai-agent.png"
  offset: 0
  cta: ""
  url: ""

- id: ai-local-llm
  title: "작업 규모에 맞는 로컬 LLM의 체급을 취미삼아 연구하고 있습니다"
  desc: "<br>개인 자동화 파이프라인을 claude code에 맡겨 왔지만, 2026년 4월부터 모델의 일관성이 흔들리면서 개인적으로 만들어놨던 CI/CD의 절반이 제대로 돌지 않는 일을 겪었습니다. 그 뒤로는 직접 일관성을 검증할 수 있는 소형 로컬 LLM에 집중해, 파인튜닝하거나 맡길 작업의 규모에 따라 어느 정도 체급의 모델이 필요한지를 공부하고 있습니다.<br>집에서 Gemma3 270M을 파인튜닝해 경제 기사를 판단하는 모델을 만들어 보고, ARM 서버에 LFM2.5 350M을 올려 속도와 지능, 대화 능력을 검증하는 식으로 실험을 이어가고 있습니다."
  img: "/assets/img/gamedev/local-llm.webp"
  offset: 0
  cta: "계기가 된 글 보기"
  url: "https://ounols.kr/posts/strange-claude/"

- id: spine-contrib
  title: "Spine 런타임에 기여해 정식 컨트리뷰터가 됐습니다"
  desc: "<br>Unity URP 12 미만 환경에서 Spine 캐릭터에 DOF 같은 포스트 프로세싱이 적용되지 않는 문제를 깊이 노멀 버퍼의 부재로 진단했습니다. Spine 스프라이트 쉐이더에 DepthNormals 패스를 추가한 PR을 spine-runtimes에 보냈고, 그대로 머지되어 Spine 4.2 정식 버전부터 함께 배포되고 있습니다."
  img: "/assets/img/gamedev/spine-pr.webp"
  img_mobile: "/assets/img/gamedev/spine-pr-mobile.webp"
  offset: 0
  cta: "머지된 PR 보기"
  url: "https://github.com/EsotericSoftware/spine-runtimes/pull/2164"

- id: game-math-series
  title: "블로그에 '게임 수학' 시리즈를 연재하고 있습니다"
  desc: "<br>학교에서 배운 게임 수학을 그래픽스 경험과 함께 정리해 블로그에 연재 중입니다. 3차원 공간, 오일러 각과 외적, 백페이스 컬링과 로드리게스 회전, 삼중곱 등을 다뤘고, 생각보다 많은 분들이 관심을 보여 주셔서 계속 이어가고 있습니다."
  img: "/assets/img/gamedev/game-math-series.webp"
  offset: 0
  cta: "시리즈 보기"
  url: "https://velog.io/@ounols/series/%EA%B2%8C%EC%9E%84-%EC%88%98%ED%95%99"

- id: moyodao
  title: "자체엔진을 웹으로 포팅해 NFT 프로젝트 Moyodao의 렌더러를 맡았습니다"
  desc: "<br>학교에서 진행한 NFT 창작자 커뮤니티 프로젝트에서 메타 캐릭터를 카드 형식으로 보여 주는 렌더러를 담당했습니다. 자체엔진을 Emscripten으로 WebGL에 포팅하고, JS에서 넘긴 이미지를 C++ 엔진이 비동기로 받아 텍스처로 올리는 연동과 마우스 입력 처리를 구현했습니다. 여러 모바일 기기의 WebGL 렌더링 오류를 잡으며 엔진을 안정화한 계기가 됐습니다."
  img: "/assets/img/gamedev/moyodao.webp"
  offset: 0
  cta: "블로그 글 보기"
  url: "https://ounols.kr/posts/%EB%AA%A8%EC%97%AC%EB%8B%A4%EC%98%A4-%ED%94%84%EB%A1%9C%EC%A0%9D%ED%8A%B8/"

- id: ajou-mentor
  title: "아주대 소프트콘 캡스톤 디자인에서 AR 프로젝트 멘토를 맡았습니다"
  desc: "<br>2021-1학기 AJOU SOFTCON에서 AR로 가구를 가상 배치해 보고 구매를 결정하는 팀 Scanit의 프로젝트를 멘토링했습니다. AR 구현을 위한 Unity 사용법 교육과 Unity 이슈 해결, 코드 커버리지 확인을 담당했고, 팀은 SW캡스톤 부문 우수상을 받았습니다."
  img: "/assets/img/gamedev/ajou-softcon.webp"
  offset: 0
  cta: "프로젝트 보기"
  url: "https://softcon.ajou.ac.kr/works/works_prev.asp?uid=426&wTerm=2021-1"

- id: miracle-diary
  title: "군 복무 중 3박 4일 해커톤으로 만든 게임형 다이어리, 미라클 다이어리"
  desc: "<br>2019 군장병 공개SW 역량강화 교육에서 4인 팀으로 습관과 할 일을 정리하고 일기 수에 따라 레벨이 오르는 안드로이드 앱을 만들어 앱 부문 정보통신산업진흥원장상을 받았습니다. 메인 클라이언트 프로그래밍과 팀원 역할 분담, Git 브랜치 관리, 발표 영상 제작을 맡았습니다."
  img: "/assets/img/gamedev/miracle-diary.webp"
  offset: 0
  cta: "GitHub 보기"
  url: "https://github.com/osam2019/APP_MIRACLE_DIARY_TEAM"

- id: yongyong-gokgok
  title: "용인 스마트폰 게임개발 아이디어 공모전 금상, 괴도앙팡으로 지스타 전시"
  desc: "<br>괴도앙팡을 기반으로 별도 진행한 프로젝트로 2017 용인 스마트폰 게임개발 아이디어 공모전 금상을 받았습니다. 괴도앙팡은 교내 무한도전 게임제작 경진대회 2등에 이어 지스타 2017 학교 부스에 게임 굿즈와 함께 전시했고, 출시 후 1만 다운로드를 넘겼습니다."
  img: "/assets/img/gamedev/angpang-gstar.webp"
  offset: 0
  cta: "발표 영상 보기"
