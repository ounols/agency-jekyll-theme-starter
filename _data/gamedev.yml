- id: dashline
  title: "게임 프로그래머의 길을 정해준 첫 게임, DashLine"
  desc: "<br>고등학교 1학년 때 어쩌다보니 팀장을 맡아 만든 첫 안드로이드 게임입니다. Java와 SVN을 사용하며 밤새 완성해 전교생 앞에서 발표했고, 원스토어에 출시했습니다. 메인 프로그래밍과 모든 사운드 작곡, 초기 기획과 그래픽, SVN 관리를 담당했고, 이런 과정을 버텼기에 지금 이 자리에 올 수 있었던 것 같습니다."
  img: "/assets/img/gamedev/dashline.webp"
  offset: 0
  cta: "원스토어 보기"
