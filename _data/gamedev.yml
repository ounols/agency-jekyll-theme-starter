- id: angpang-maptool
  title: "퍼즐 게임을 위한 맵툴을 C++로 직접 만들었습니다"
  desc: "<br>레벨 디자인이 핵심인 퍼즐 게임이라 WinAPI·OpenGL 기반 맵툴을 따로 제작했습니다. 맵 크기 조정과 타일 배치, 저장·불러오기에서 시작해 구역 지정, 타일 에셋 추가, 이동 횟수 제한, 포탈 태그와 말풍선 배치까지 확장했고, 저장한 맵 파일을 Unity에서 파싱해 바로 플레이할 수 있게 했습니다."
  img: "/assets/img/gamedev/angpang-maptool.webp"
  offset: 0
